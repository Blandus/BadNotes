<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio Bildraten-Test</title>
<style>
  /* Diagnostic page without Folio: does the device draw web pages at 60/120 fps at all? */
  :root { color-scheme: light dark; --bg: #fff; --fg: #0F2747; --sub: #5b6b80; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161b; --fg: #e8ecf2; --sub: #9aa6b6; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: baseline; }
  .sub { color: var(--sub); font-size: 13px; }
  canvas { flex: 1; width: 100%; touch-action: none; border-top: 1px solid #8884; display: block; }
</style>
</head>
<body>
<header>
  <h1>Bildraten-Test (ohne Folio)</h1>
  <div class="row">
    <div><div class="sub">jetzt</div><div class="big" id="now">–</div></div>
    <div><div class="sub">beim Zeichnen (letzter Strich)</div><div class="big" id="draw">–</div></div>
  </div>
  <div class="sub" id="info"></div>
  <div class="sub">Unten mit dem Pencil schreiben. 60 bzw. 120 fps = das Gerät schafft es; 30 fps auch hier = Safari/iPadOS drosselt Webseiten.</div>
</header>
<canvas id="c"></canvas>
<script>
  const $ = id => document.getElementById(id);
  const fps = gaps => { const s = gaps.slice().sort((a, b) => a - b); return s.length ? Math.round(1000 / s[s.length >> 1]) : '–'; };
  $('info').textContent = `Bildschirm ${screen.width}×${screen.height} · dpr ${devicePixelRatio} · ${matchMedia('(display-mode: standalone)').matches ? 'Home-Bildschirm-App' : 'Browser'} · reduzierte Bewegung: ${matchMedia('(prefers-reduced-motion: reduce)').matches ? 'an' : 'aus'}`;
  // frame rate, always running (median of the last second)
  let last = 0; const gaps = [];
  const loop = t => { if (last) { gaps.push(t - last); if (gaps.length > 60) gaps.shift(); } last = t; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  setInterval(() => { $('now').textContent = fps(gaps) + ' fps'; }, 500);
  // simple drawing: lines straight from the pointer events
  const c = $('c'), ctx = c.getContext('2d');
  const size = () => { const r = c.getBoundingClientRect(); c.width = r.width * devicePixelRatio; c.height = r.height * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = getComputedStyle(document.body).color; };
  size(); addEventListener('resize', size);
  let down = null, strokeGaps = [];
  c.addEventListener('pointerdown', e => { down = [e.offsetX, e.offsetY]; strokeGaps = []; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => {
    if (!down) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    ctx.beginPath(); ctx.moveTo(down[0], down[1]);
    for (const ev of (evs.length ? evs : [e])) { ctx.lineTo(ev.offsetX, ev.offsetY); down = [ev.offsetX, ev.offsetY]; }
    ctx.stroke();
  });
  const up = () => { if (down) { down = null; $('draw').textContent = fps(gaps.slice(-30)) + ' fps'; } };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
